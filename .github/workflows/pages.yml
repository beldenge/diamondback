name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - name: Require extract CDN
        env:
          VITE_EXTRACT_BASE: ${{ vars.VITE_EXTRACT_BASE }}
        run: |
          if [ -z "$VITE_EXTRACT_BASE" ]; then
            echo "::error::Set repository variable VITE_EXTRACT_BASE to the CloudFront origin (e.g. https://d3en1dc3mw7cky.cloudfront.net)"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_EXTRACT_BASE: ${{ vars.VITE_EXTRACT_BASE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
